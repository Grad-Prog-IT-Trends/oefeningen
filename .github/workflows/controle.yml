# De controle van Bliep. GitHub voert dit uit op een eigen machine (een runner),
# bij elke pull request naar main en bij elke push op main.
# Je hoeft hier niets aan te veranderen. Het leerdoel is lezen en snappen.
#
# Let op wat deze Action NIET doet: hij rolt niets uit. Hij zegt alleen of een
# wijziging mag. Het uitrollen doet de GitOps-agent op de server (gitops/sync.js):
# die haalt main zelf op. Zo heeft GitHub nooit de sleutels van je server nodig.

name: Controle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      # 1. Haal de code van deze pull request op.
      - uses: actions/checkout@v5

      # 2. Node installeren, voor de controles en de tests hieronder.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Is compose.yaml geldige YAML, en kent Compose alle sleutels?
      - name: Is de Compose-file geldig?
        run: docker compose config --quiet

      # 4. Staan er in config/bliep.env alleen toegelaten sleutels met geldige waarden?
      - name: Klopt de configuratie?
        run: node gitops/controleer-config.js

      # 5. Draaien de tests van de webshop nog?
      - name: Tests van de webshop
        working-directory: webshop
        run: |
          npm ci
          npm test

      # 6. Lukt het om het image van de webshop te bouwen?
      - name: Bouwt het image?
        run: docker compose build web

# compose.yaml: de volledige Bliep-omgeving, als code.
#
# Dit is de compose-file uit les 4, volledig ingevuld. In les 5 verandert hier
# bijna niets: alleen de regel PUSH_SLEUTEL bij web is nieuw.
#
# Opstarten:   docker compose up -d --build
# Bekijken:    docker compose ps
# Afbreken:    docker compose down        (de gegevens in de database blijven)
# Verwoesten:  docker compose down -v     (ook de gegevens zijn weg)

name: bliep

services:

  web:
    build: ./webshop
    env_file: config/bliep.env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://bliep:bliep-demo@db:5432/bliep
      GIT_COMMIT: ${GIT_COMMIT:-lokaal}
      # Les 5: een geheim hoort niet in git. Docker Compose leest de waarde uit het
      # bestand .env in deze map. Dat bestand staat in .gitignore en gaat dus nooit mee.
      # Geen .env? Dan is PUSH_SLEUTEL leeg en stuurt de webshop geen drop-meldingen.
      PUSH_SLEUTEL: ${PUSH_SLEUTEL:-}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bliep
      # Een wachtwoord in een bestand in git? Voor een lokale demo met een database
      # die nooit buiten je laptop komt, aanvaarden we het. Zie les 5, slide "Niet alles
      # wat rood is, is een ramp".
      POSTGRES_PASSWORD: bliep-demo
      POSTGRES_DB: bliep
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bliep", "-d", "bliep"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
